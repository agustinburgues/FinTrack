{% extends "base/base.html" %}

{% block title %}
Registro
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="mb-4 text-center">Crear cuenta</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary w-100" type="submit">Registrarse</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
