{% extends "base/base.html" %}

{% block title %}Eliminar presupuesto{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body text-center">
                <h3>¿Eliminar el presupuesto de <strong>{{ budget.category }}</strong>?</h3>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'budgets:list' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
