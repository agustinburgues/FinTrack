{% extends "base/base.html" %}

{% block title %}Eliminar aporte{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body text-center">
                <h3 class="mb-4">¿Eliminar este aporte?</h3>

                <p><strong>Meta:</strong>{{ goal.name }}</p>

                <p><strong>Importe:</strong>  € {{ contribution.amount }}</p>

                {% if contribution.note %}
                    <p><strong>Nota:</strong>{{ contribution.note }}</p>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'goals:detail' goal.pk %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Eliminar aporte</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
